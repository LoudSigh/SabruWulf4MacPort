name: Rights-safe tests

on:
  push:
  pull_request:

jobs:
  package-and-inventory:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked game media and disassembly
        shell: bash
        run: |
          tracked="$(git ls-files -- 'SNAPSHOTS/**' 'reverse_engineering/private/**' 'reverse_engineering/generated/**' '*.asm' '*.s' '*.inc' '*.dis' '*.lst' '*.skool' '*.ram' '*.bin' '*.sna' '*.z80' '*.tap' '*.tzx' '*.rom')"
          if [[ -n "$tracked" ]]; then
            echo "Tracked game media or disassembly is forbidden"
            exit 1
          fi
      - name: Check local preview launcher syntax
        run: |
          head -n 1 'Run Sabre Wulf Preview.command' | grep -Fx '#!/bin/bash'
          bash -n 'Run Sabre Wulf Preview.command'
      - name: Test shared Swift package
        run: swift test
      - name: Test TZX inventory with synthetic data
        run: |
          swiftc -parse-as-library Tools/TapeInventory.swift -o "$RUNNER_TEMP/TapeInventory"
          "$RUNNER_TEMP/TapeInventory" --self-test
      - name: Test source-free PC coverage union
        run: |
          swiftc -parse-as-library Sources/GameCore/*.swift reverse_engineering/tools/CoverageUnion.swift -o "$RUNNER_TEMP/CoverageUnion"
          "$RUNNER_TEMP/CoverageUnion" --self-test
      - name: Validate source-free room evidence
        run: |
          jq -e '.layout.dimensions == [16,16] and .roomTable.pointerCount == 48 and .records.regularRooms.contiguousTerminatedRecords == 48 and .records.regularRooms.placementBoundsByteCount == 6433 and .records.regularRooms.placementBoundsSHA256 == "d3aae958c56e8e1dd8f62e45a27ab8ddd320ed31a36f078ce87f8b792301334f" and .crossSnapshotComparison.regularRoomBytesIdentical' reverse_engineering/analysis/room-index.json
          jq -e '(.classificationCounts | [.code, .data, .padding, .unknown] | add) == .totalBytes and .classificationCounts.data == 29178 and .classificationCounts.unknown == 19974 and ([.knownDataIntervals[] | select(.start == "0x70BC" and .endExclusive == "0x9692")] | length) == 1' reverse_engineering/analysis/byte-coverage.json
          jq -e '.pointerCount == 196 and .distinctPointers == 153 and .nonEmptyBitmapRecords == 152 and .emptySentinelPointer == 49420 and (.emptySentinelIDs | length) == 14 and .identicalBetweenCaptures and .spriteRecordBytesAccountedFor == 8006 and .spriteRecordBytesIdenticalBetweenCaptures' reverse_engineering/analysis/sprite-index.json
          jq -e '.distinctBackgrounds == 41 and .contiguousRecords == 41 and .start == "0x70BC" and .endExclusive == "0x9692" and .totalPlacements == 919 and .recordBytes == 9686 and .recordBytesSHA256 == "2691664c054cf02c5dc03076f5cc6633857d98c0c800cb053787bd9dd5360f61" and .recordsIdenticalBetweenCaptures and [.capturedRoomScreenCheck.roomID, .capturedRoomScreenCheck.roomTemplate, .capturedRoomScreenCheck.coveredRGBPixels, .capturedRoomScreenCheck.matchingRGBPixels, .capturedRoomScreenCheck.uncoveredPixels] == [168,8,29056,29056,20096]' reverse_engineering/analysis/background-index.json
          jq -e '.totals.exactColorFrames == 489 and .totals.frames == 500 and .wMismatchOverlap.mismatchingFrames == 11 and .wMismatchOverlap.framesWithOverlappingActorSlot18 == 11 and .wMismatchOverlap.mismatchingWhitePixels == 124 and .wMismatchOverlap.mismatchesInsideOtherActorRectangle == 98 and .wMismatchOverlap.mismatchesOnOtherActorBitmapMask == 48 and .wMismatchOverlap.mismatchesInOtherActorBitmapOccupiedAttributeCells == 124 and .wBitmapOverlap.sourceFrames == 11 and .wBitmapOverlap.playerRectangleBitmapPixelsChecked == 3776 and .wBitmapOverlap.playerRectangleBitmapPixelsMatchingXorProjection == 3776 and .wBitmapOverlap.bitmapDifferencesVersusPlayerAlone == 64 and .wBitmapOverlap.differencesOnOverlappingActorSetMask == 64 and .wBitmapOverlap.otherActorSetMaskPixelsInsidePlayerRectangle == 64 and .wBitmapOverlap.playerBitOffSourceBitOn == 38 and .wBitmapOverlap.playerBitOnSourceBitOff == 26' reverse_engineering/analysis/actor-screen.json
          jq -e '.sourceFrames == 100 and .matchingCompleteRAMFrames == 100 and .sampleWindow.framesInclusive == [40,55] and .sampleWindow.attributeTileColumnsInclusive == [14,17] and .sampleWindow.attributeTileRowsInclusive == [10,12] and .sampleWindow.writes == 94 and .sampleWindow.changedWrites == 31 and .sampleWindow.distinctInstructionStarts == 1 and .playerOverlap.framesInclusive == [43,53] and .playerOverlap.changedWritesInAffectedPlayerRowAndColumns == 22 and .playerOverlap.framesWithChangedWrites == 11' reverse_engineering/analysis/reference-actor-attribute-writes.json
          jq -e '.sourceFrames == 100 and .matchingCompleteRAMFrames == 100 and .sampledAttributeWrites == 94 and .matchingRegisterContexts == 94 and .indexedActorPointerContext.playerWrites == 78 and .indexedActorPointerContext.otherActorSlot18Writes == 16 and .indexedActorPointerContext.otherPointers == 0 and .indexedActorPointerContext.otherActorFrames == [41,43,45,47,49,51,53,55] and .attributeInkClassification.playerContextWhiteInkWrites == 78 and .attributeInkClassification.otherActorContextNonwhiteInkWrites == 16 and .recordFieldEquality.playerWritesMatchingOnlyRecordOffset5 == 78 and .recordFieldEquality.otherActorWritesMatchingAnyRecordByte == 0 and .affectedPlayerRowChangedWritesAcrossOverlap.playerIndexedWrites == 11 and .affectedPlayerRowChangedWritesAcrossOverlap.otherActorIndexedWrites == 11' reverse_engineering/analysis/reference-actor-attribute-context.json
          jq -e '.framesCompared == 180 and .independentActorMatches == 180 and .independentScreenMatches == 174 and .screenMismatchFrames == [68,69,70,71,72,73] and .heldDirectionParity.nativeActorMatches == 600 and .heldDirectionParity.framesPerDirection == 150 and [.checkpoints[1].roomID, .checkpoints[1].x, .checkpoints[1].y] == [152,121,42] and [.checkpoints[3].roomID, .checkpoints[3].x, .checkpoints[3].y] == [152,121,191]' reverse_engineering/analysis/reference-transition.json
          jq -e '.roundTripParity.framesCompared == 200 and .roundTripParity.independentActorMatches == 200 and .roundTripParity.nativeActorMatches == 200 and .roundTripParity.independentScreenMatches == 184 and [.roundTripParity.checkpoints[1].roomID, .roundTripParity.checkpoints[1].x, .roundTripParity.checkpoints[1].y] == [168,121,190] and [.roundTripParity.checkpoints[3].roomID, .roundTripParity.checkpoints[3].x, .roundTripParity.checkpoints[3].y] == [168,120,39]' reverse_engineering/analysis/reference-transition.json
          jq -e '.westExitProbe.framesCompared == 256 and .westExitProbe.nativeMatchesManualCPUReplay == 256 and .westExitProbe.unmodifiedStepFrameActorMatches == 182 and .westExitProbe.firstRNGStateDivergenceFrame == 101 and .westExitProbe.firstMovingEntityDivergenceFrame == 102 and .westExitProbe.firstActorStateDivergenceFrame == 163 and .westExitProbe.firstStepFrameActorMismatch == 183 and [.westExitProbe.checkpoints[1].frame, .westExitProbe.checkpoints[1].roomID, .westExitProbe.checkpoints[1].x] == [226,151,0] and [.westExitProbe.checkpoints[2].frame, .westExitProbe.checkpoints[2].x] == [233,239]' reverse_engineering/analysis/reference-transition.json
          jq -e '.eastReturnProbe.framesCompared == 279 and .eastReturnProbe.nativeMatchesManualCPUReplay == 279 and .eastReturnProbe.firstUnmodelledMovingActorBlockFrame == 280 and [.eastReturnProbe.sourceEnemyPositionAtBlock.roomID, .eastReturnProbe.sourceEnemyPositionAtBlock.x, .eastReturnProbe.sourceEnemyPositionAtBlock.y] == [152,85,130] and [.eastReturnProbe.checkpoints[1].frame, .eastReturnProbe.checkpoints[1].roomID, .eastReturnProbe.checkpoints[1].x] == [246,152,238] and [.eastReturnProbe.checkpoints[3].frame, .eastReturnProbe.checkpoints[3].x] == [253,0]' reverse_engineering/analysis/reference-transition.json
          jq -e '.frameTimingReconciliation.mode == "reference-relative" and .frameTimingReconciliation.westMatchingRAMFrames == .frameTimingReconciliation.westFramesCompared and .frameTimingReconciliation.westFramesCompared == 256 and .frameTimingReconciliation.northMatchingRAMFrames == .frameTimingReconciliation.northFramesCompared and .frameTimingReconciliation.northFramesCompared == 180 and .frameTimingReconciliation.roundTripMatchingRAMFrames == .frameTimingReconciliation.roundTripFramesCompared and .frameTimingReconciliation.roundTripFramesCompared == 200 and .frameTimingReconciliation.absoluteWestMatchingRAMFrames == 3' reverse_engineering/analysis/reference-transition.json
          jq -e '.frameBoundaryMode == "reference-relative" and .framesCompared == 100 and .matchingRAMFrames == 100 and .matchingScreenFrames == 100 and [.actorStayedAt.roomID, .actorStayedAt.x, .actorStayedAt.y] == [168,57,112] and [.actorStateCheckpoints[1].frame, .actorStateCheckpoints[1].kind, .actorStateCheckpoints[7].frame, .actorStateCheckpoints[7].kind] == [21,42,41,20]' reverse_engineering/analysis/reference-fire-observation.json
          jq -e '.framesPerRun == 190 and .fireRAMAndScreenMatches == 190 and .comparisonRAMAndScreenMatches == 190 and .unrelatedKeyRAMAndScreenMatches == 190 and [.firstPlayerStateDifferenceFrame, .firstEnemyStateDifferenceFrame, .firstEnemyPositionDifferenceFrame] == [146,156,159] and [.noFireDamageFrame, .unrelatedKeyDamageFrame, .fireDamageFramesThrough190] == [164,170,0] and [.checkpoints[0].fireEnemyX, .checkpoints[0].noFireEnemyX, .checkpoints[1].noFirePlayerKind] == [86,104,64]' reverse_engineering/analysis/reference-fire-encounter.json
          jq -e '.totals.contactCalls == 3881 and .totals.matchingContactCalls == 3881 and .extendedRuns.matchingRAMFrames == 1800 and .extendedRuns.matchingContactCalls == 4477 and .extendedRuns.contactCalls == 4477' reverse_engineering/analysis/reference-contact.json
          jq -e '.firstInjuryRoutine.matchingUpdatesAcrossThreeRuns == 189 and ([.observations[].matchingRAMAndScreenFrames]|add) == 1800 and all(.observations[]; .kind65[1] - .kind65[0] + 1 == 66)' reverse_engineering/analysis/reference-damage.json
          jq -e '.totals.frameChecks == 2400 and .totals.matchingRAMAndScreenFrames == 2400 and .totals.matchingContactCalls == 4477 and .totals.matchingFirstInjuryUpdates == 189 and [.scenarios[].firstExactMenuTextFrame] == [503,510,679] and all(.scenarios[]; .menuSetupFrame == .secondContactFrame + 68 and .menuReturnRoutineFrame == .secondContactFrame + 199 and .firstExactMenuTextFrame == .secondContactFrame + 205) and ([.scenarios[].matchingRAMAndScreenFrames]|add) == .totals.matchingRAMAndScreenFrames' reverse_engineering/analysis/reference-menu-return.json
          jq -e '.frames == 800 and .matchingRAMAndScreenFrames == 800 and .firstExactMenuTextFrame == 503 and .startKeyIntervalZeroBased == [530,535] and .stableNewGameStateFromFrame == 660 and [.stableActorRoomID,.stableActorX,.stableActorY,.stableActorKind,.stableLifeByte] == [168,120,112,16,4] and .firstCoveredRoomRGBMatchFrame == 664 and .matchingCoveredRGBPixelsAt664 == .coveredRGBPixels and .coveredRGBPixels == 29056 and .matchingContactCalls == 2321 and .matchingFirstInjuryUpdates == 63' reverse_engineering/analysis/reference-restart.json
          jq -e '.frames == 800 and .matchingRAMAndScreenFrames == 800 and .firstExactMenuTextFrame == 503 and .keyboardMenuIntervalZeroBased == [515,525] and .rightKeyIntervalZeroBased == [680,800] and .firstPlayerXMoveFrame == 789 and [.actorAtFrame800.roomID,.actorAtFrame800.x,.actorAtFrame800.y,.actorAtFrame800.kind,.actorAtFrame800.lifeByte] == [168,148,112,22,4] and .matchingCoveredRGBPixelsAt800 == .coveredRGBPixelsAt800 and .coveredRGBPixelsAt800 == 29056 and .matchingContactCalls == 2309 and .noKeyboardMenuKeyControl.firstPlayerXMoveFrame == 793' reverse_engineering/analysis/reference-restart-keyboard.json
          jq -e '.framesPerDirection == 900 and .matchingRAMAndScreenFramesPerDirection == 900 and .sourceReadyFrame == 790 and .nativeSliceFirstFrame == 791 and .nativeSliceLastFrame == 900 and .nativeActorRoomXYMatches == 110 and .nativeSpriteKindMatches == 110 and .sourceKeyIntervalZeroBased == [788,850] and .firstActorXMoveFrame == 793 and [.start.roomID,.start.x,.start.y] == [168,120,112] and [.checkpoints[1].x,.checkpoints[3].x] == [193,193] and [.additionalDirections[].nativeActorRoomXYMatches] == [110,110,76] and [.additionalDirections[].nativeSpriteKindMatches] == [110,110,76] and [.additionalDirections[].matchingContactCalls] == [2661,2690,2645] and .totals.referenceRAMAndScreenFrames == 3600 and .totals.nativeActorRoomXYMatches == 406 and .totals.nativeSpriteKindMatches == 406 and .totals.matchingContactCalls == 10648' reverse_engineering/analysis/reference-new-game-movement.json
          jq -e '.frames == 900 and .matchingRAMAndScreenFrames == 900 and .matchingContactCalls == 2661 and .nativeReadyAtFrame == 790 and .matchingNativeRoomXYFrames == 110 and .matchingNativeSpriteIDFrames == 76 and .firstUnverifiedNativeSpriteFrame == 867 and [.checkpoints[0].x,.checkpoints[1].y,.checkpoints[3].x,.checkpoints[3].y] == [160,90,208,86] and .matchingCoveredRGBPixelsAt900 == .coveredRGBPixelsAt900 and .coveredRGBPixelsAt900 == 29056' reverse_engineering/analysis/reference-new-game-mixed.json
          jq -e '.entitySlot == 12 and .roomID == 152 and .observedEntityKinds == [108,109,110,111] and [.staticCollisionBox.width,.staticCollisionBox.height] == [16,19] and [.paths[].matchingMovingUpdates] == [2,4,8] and .extendedFire.matchingAdditionalMovingUpdates == 3 and .extendedFire.secondDirectionFrame == 220 and .totals.matchingMovingUpdates == 17 and .totals.observedMovingUpdates == 17' reverse_engineering/analysis/reference-entity-motion.json
          jq -e '.entitySlot == 12 and .roomID == 152 and .kindRange == [108,111] and .choiceVelocities == [-96,-80,-64,-48,48,64,80,96] and .matchingRoutineChoices == 4 and [.boundedChoices[].frame] == [156,156,156,220] and [.boundedChoices[].velocityX] == [96,48,-48,-80]' reverse_engineering/analysis/reference-enemy-direction.json
          jq -e '.totals.verifiedRAMFrames == 6900 and .totals.distinctExecutedRAMPCStartsInUnion == 2589 and .totals.minimumExecutedRAMPC == "0x5CB0" and .totals.maximumExecutedRAMPC == "0xBF83" and .totals.executedPCStartsWithinKnownDataIntervals == 0 and .totals.executedPCStartsWithinValidatedSpriteRecords == 0 and ([.replays[].matchingRAMFrames]|add) == .totals.verifiedRAMFrames' reverse_engineering/analysis/executed-pc-coverage.json
      - name: Test private image downloader with synthetic inputs
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s reverse_engineering/tests -p 'test_download_skoolkit_images.py' -v

  native-app-builds:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build macOS app
        run: xcodebuild -quiet -project SabreWulf.xcodeproj -scheme SabreWulfMac -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS simulator app
        run: xcodebuild -quiet -project SabreWulf.xcodeproj -scheme SabreWulfiOS -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build visionOS simulator app
        run: xcodebuild -quiet -project SabreWulf.xcodeproj -scheme SabreWulfVision -configuration Debug -destination 'generic/platform=visionOS Simulator' CODE_SIGNING_ALLOWED=NO build
