name: Rights-safe tests

on:
  push:
  pull_request:

jobs:
  package-and-inventory:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked game media and disassembly
        shell: bash
        run: |
          tracked="$(git ls-files -- 'SNAPSHOTS/**' 'reverse_engineering/private/**' 'reverse_engineering/generated/**' '*.asm' '*.s' '*.inc' '*.dis' '*.lst' '*.skool' '*.ram' '*.bin' '*.sna' '*.z80' '*.tap' '*.tzx' '*.rom')"
          if [[ -n "$tracked" ]]; then
            echo "Tracked game media or disassembly is forbidden"
            exit 1
          fi
      - name: Check local preview launcher syntax
        run: bash -n 'Run Sabre Wulf Preview.command'
      - name: Test shared Swift package
        run: swift test
      - name: Test TZX inventory with synthetic data
        run: |
          swiftc -parse-as-library Tools/TapeInventory.swift -o "$RUNNER_TEMP/TapeInventory"
          "$RUNNER_TEMP/TapeInventory" --self-test
      - name: Validate source-free room evidence
        run: |
          jq -e '.layout.dimensions == [16,16] and .roomTable.pointerCount == 48 and .records.regularRooms.contiguousTerminatedRecords == 48 and .crossSnapshotComparison.regularRoomBytesIdentical' reverse_engineering/analysis/room-index.json
          jq -e '(.classificationCounts | [.code, .data, .padding, .unknown] | add) == .totalBytes and .classificationCounts.data == 19492' reverse_engineering/analysis/byte-coverage.json
          jq -e '.pointerCount == 196 and .distinctPointers == 153 and .identicalBetweenCaptures and .spriteRecordBytesAccountedFor == 8006 and .spriteRecordBytesIdenticalBetweenCaptures' reverse_engineering/analysis/sprite-index.json
          jq -e '.framesCompared == 180 and .independentActorMatches == 180 and .independentScreenMatches == 174 and .screenMismatchFrames == [68,69,70,71,72,73] and .heldDirectionParity.nativeActorMatches == 600 and .heldDirectionParity.framesPerDirection == 150 and [.checkpoints[1].roomID, .checkpoints[1].x, .checkpoints[1].y] == [152,121,42] and [.checkpoints[3].roomID, .checkpoints[3].x, .checkpoints[3].y] == [152,121,191]' reverse_engineering/analysis/reference-transition.json
          jq -e '.roundTripParity.framesCompared == 200 and .roundTripParity.independentActorMatches == 200 and .roundTripParity.nativeActorMatches == 200 and .roundTripParity.independentScreenMatches == 184 and [.roundTripParity.checkpoints[1].roomID, .roundTripParity.checkpoints[1].x, .roundTripParity.checkpoints[1].y] == [168,121,190] and [.roundTripParity.checkpoints[3].roomID, .roundTripParity.checkpoints[3].x, .roundTripParity.checkpoints[3].y] == [168,120,39]' reverse_engineering/analysis/reference-transition.json
          jq -e '.westExitProbe.framesCompared == 256 and .westExitProbe.nativeMatchesManualCPUReplay == 256 and .westExitProbe.unmodifiedStepFrameActorMatches == 182 and .westExitProbe.firstActorStateDivergenceFrame == 163 and .westExitProbe.firstStepFrameActorMismatch == 183 and [.westExitProbe.checkpoints[1].frame, .westExitProbe.checkpoints[1].roomID, .westExitProbe.checkpoints[1].x] == [226,151,0] and [.westExitProbe.checkpoints[2].frame, .westExitProbe.checkpoints[2].x] == [233,239]' reverse_engineering/analysis/reference-transition.json
      - name: Test private image downloader with synthetic inputs
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s reverse_engineering/tests -p 'test_download_skoolkit_images.py' -v

  native-app-builds:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build macOS app
        run: xcodebuild -quiet -project SabreWulf.xcodeproj -scheme SabreWulfMac -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Build iOS simulator app
        run: xcodebuild -quiet -project SabreWulf.xcodeproj -scheme SabreWulfiOS -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build visionOS simulator app
        run: xcodebuild -quiet -project SabreWulf.xcodeproj -scheme SabreWulfVision -configuration Debug -destination 'generic/platform=visionOS Simulator' CODE_SIGNING_ALLOWED=NO build
